<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f1e7">
  <meta name="description" content="Et lille fælles bento-arkiv">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <title>{% block title %}Hobby Bento{% endblock %}</title>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">vores lille arkiv</div>
        <a class="brand" href="{{ url_for('today') }}">Hobby Bento</a>
      </div>
      <span class="pill">いただきます</span>
    </header>

    <nav class="nav" aria-label="Primær navigation">
      <a href="{{ url_for('today') }}" class="{{ 'active' if active_page == 'today' else '' }}">Dagens</a>
      <a href="{{ url_for('history') }}" class="{{ 'active' if active_page == 'history' else '' }}">Historik</a>
      <a href="{{ url_for('analytics') }}" class="{{ 'active' if active_page == 'analytics' else '' }}">Analytics</a>
      <a href="{{ url_for('new_bento') }}" class="{{ 'active' if active_page == 'new' else '' }}">Ny Bento</a>
    </nav>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="notice {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
